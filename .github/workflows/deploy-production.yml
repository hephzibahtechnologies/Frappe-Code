name: Deploy to Production

# Manual-only, on purpose: this never runs on push. Pulls whatever image
# tag was already built/pushed by the "Build & Push Images" workflow and
# recreates the stack on 208.109.38.159. No rebuild happens here.
#
# Safety steps (run BEFORE anything on the server is changed - a failure in any
# of them aborts the deploy with nothing touched):
#   1. Preflight: enough free disk for the ~16 GB image (min_free_gb).
#   2. Pre-deploy backup of mysite.local (database + public/private files) to
#      /home/david/backups/crm/<UTC-time>_to-<tag>/ with a MANIFEST.txt naming
#      the image that was running before. Newest 7 kept.
#   After the deploy: smoke checks (ping + login page) fail the run if the new
#   version does not answer. Same steps, same tested code as "Deploy to Staging".
#   Use backup_only=true to rehearse steps 1-2 without deploying.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy: latest-production, or a 12-char commit SHA (e.g. promote the exact image QA ran)"
        required: false
        default: "latest-production"
      backup_only:
        description: "Rehearsal: run the disk check and the backup ONLY. No image change, no restart."
        required: false
        type: boolean
        default: false
      skip_backup:
        description: "EMERGENCY ONLY: deploy without the pre-deploy backup (default false)"
        required: false
        type: boolean
        default: false
      min_free_gb:
        description: "Abort if the root filesystem has less free space than this (GB)"
        required: false
        default: "25"

env:
  REGISTRY: ghcr.io
  APP_IMAGE_NAME: hephzibahtechnologies/frappe-code

jobs:
  deploy:
    name: Deploy to frappe-crm (208.109.38.159 — production)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}              # 208.109.38.159
          username: ${{ secrets.PROD_USER }}           # david
          password: ${{ secrets.PROD_SSH_PASSWORD }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            set -o pipefail
            IMAGE_TAG="${{ inputs.image_tag }}"
            IMAGE="${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:${IMAGE_TAG}"
            cd /home/david/frappe-crm

            echo "=== Logging in to GHCR ==="
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.STAGING_USER }}" --password-stdin

            echo "=== Preflight: free disk space ==="
            MIN_FREE_GB=${{ inputs.min_free_gb }}
            FREE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
            echo "Free on /: ${FREE_GB} GB (need >= ${MIN_FREE_GB} GB)"
            if [ "${FREE_GB}" -lt "${MIN_FREE_GB}" ]; then
              echo "ABORT: not enough free disk space - nothing has been changed. Free space (e.g. 'docker image prune -f') and re-run."
              exit 1
            fi

            if [ "${{ inputs.backup_only }}" != "true" ]; then
              echo "=== Pulling ${IMAGE} ==="
              docker pull "${IMAGE}"
              docker tag "${IMAGE}" crm-deploy:${IMAGE_TAG}
            fi

            if [ "${{ inputs.skip_backup }}" = "true" ]; then
              echo "WARNING: skip_backup=true — deploying WITHOUT a pre-deploy backup."
            else
              echo "=== Pre-deploy backup (database + files) — nothing is changed until this succeeds ==="
              BACKUP_ROOT=/home/david/backups/crm
              KEEP=7
              STAMP=$(date -u +%Y%m%dT%H%M%SZ)
              DEST="${BACKUP_ROOT}/${STAMP}_to-${IMAGE_TAG}"
              PREV_TAG=$(grep '^CUSTOM_TAG=' .env | cut -d= -f2 || true)
              PREV_IMAGE_ID=$(docker inspect crm-backend-1 --format '{{.Image}}' 2>/dev/null || true)
              if [ -z "${PREV_IMAGE_ID}" ]; then
                echo "ABORT: crm-backend-1 is not running, so a backup cannot be taken. Nothing has been changed. Start it, or re-run with skip_backup=true if you accept deploying without a backup."
                exit 1
              fi

              umask 077
              mkdir -p "${DEST}"
              # mariadb-dump in the app image insists on SSL but the db container has none
              # ("SSL is required, but the server does not support it"), which made every
              # bench backup fail. Point the client at a throwaway my.cnf with skip-ssl,
              # for this one command only.
              docker exec crm-backend-1 bash -c 'mkdir -p /tmp/mycnf && printf "[client]\nskip-ssl\n" > /tmp/mycnf/my.cnf'
              BK_RC=0
              OUT=$(docker exec -e MYSQL_HOME=/tmp/mycnf crm-backend-1 bench --site mysite.local backup --with-files 2>&1 | tr '\r' '\n') || BK_RC=$?
              echo "${OUT}"
              if [ "${BK_RC}" -ne 0 ]; then
                echo "ABORT: bench backup failed (exit ${BK_RC}) — nothing has been changed."
                rmdir "${DEST}" 2>/dev/null || true
                exit 1
              fi
              FILES=$(echo "${OUT}" | grep -o '/[^ ]*/mysite.local/private/backups/[^ ]*' | sort -u || true)
              if [ "$(echo "${FILES}" | grep -c .)" -lt 3 ]; then
                echo "ABORT: bench backup did not report the expected files — nothing has been changed."
                rmdir "${DEST}" 2>/dev/null || true
                exit 1
              fi
              for f in ${FILES}; do
                docker cp "crm-backend-1:${f}" "${DEST}/"
              done
              chmod -R go-rwx "${DEST}"

              echo "--- verifying backup files ---"
              gzip -t "${DEST}"/*-database.sql.gz
              for t in "${DEST}"/*-files.tar; do tar -tf "$t" >/dev/null; done

              {
                echo "timestamp_utc=${STAMP}"
                echo "deploy_target_tag=${IMAGE_TAG}"
                echo "target_image_id=$(docker image inspect "${IMAGE}" --format '{{.Id}}')"
                echo "target_repo_digests=$(docker image inspect "${IMAGE}" --format '{{join .RepoDigests ","}}')"
                echo "previous_tag=${PREV_TAG}"
                echo "previous_image_id=${PREV_IMAGE_ID}"
                echo "previous_repo_digests=$(docker image inspect "${PREV_IMAGE_ID}" --format '{{join .RepoDigests ","}}' 2>/dev/null || true)"
                echo "workflow_run=${{ github.run_id }}"
                echo "triggered_by=${{ github.actor }}"
              } > "${DEST}/MANIFEST.txt"

              # Backup is safely on the host and verified: drop this run's copies
              # (absolute paths bench itself reported) inside the sites volume so they do not accumulate there too.
              for f in ${FILES}; do
                docker exec crm-backend-1 rm -f "${f}"
              done

              # Retention: keep the newest ${KEEP} backup folders (name starts with the UTC stamp).
              find "${BACKUP_ROOT}" -mindepth 1 -maxdepth 1 -type d -name '2*T*Z_to-*' | sort | head -n -${KEEP} | xargs -r rm -rf
              echo "Backup saved: ${DEST} ($(du -sh "${DEST}" | cut -f1))"
            fi


            if [ "${{ inputs.backup_only }}" = "true" ]; then
              echo "backup_only=true - backup finished. NOT deploying: no image change, no restart."
              exit 0
            fi

            echo "=== Updating .env — same folder, same volumes, no data touched ==="
            sed -i "s/^CUSTOM_TAG=.*/CUSTOM_TAG=${IMAGE_TAG}/" .env

            echo "=== Recreating all app-tier services from the new tag ==="
            docker-compose up -d

            echo "=== Waiting for backend to become healthy before migrating ==="
            for i in $(seq 1 30); do
              if docker exec crm-backend-1 curl -sf -H "Host: mysite.local" http://localhost:8000/api/method/ping >/dev/null 2>&1; then
                echo "Backend is up."
                break
              fi
              echo "Backend not ready yet, waiting... ($i/30)"
              sleep 5
              if [ "$i" -eq 30 ]; then
                echo "Backend never became healthy — aborting before migrate."
                exit 1
              fi
            done

            echo "=== Running bench migrate (schema/patches — do NOT skip, do NOT run manually on the server) ==="
            echo "=== (scoped to mysite.local, not 'all' — unrelated/broken sites on this box must not fail this job) ==="
            echo "=== (piped through tr to flatten the progress bar's \r output — appleboy/ssh-action mis-parses raw \r and can report a false failure even when migrate succeeds) ==="
            docker exec crm-backend-1 bench --site mysite.local migrate 2>&1 | tr '\r' '\n'

            echo "=== Force-reimporting DMS Workspace/Number Card/Dashboard Chart/Sidebar fixtures ==="
            echo "=== (bench migrate does NOT overwrite these once they exist in the DB — see quality_dms dashboard incident 2026-07-28) ==="
            for f in \
              apps/quality_dms/quality_dms/dms/workspace/dms/dms.json \
              apps/quality_dms/quality_dms/dms/number_card/pending_revision_requests/pending_revision_requests.json \
              apps/quality_dms/quality_dms/dms/number_card/total_revisions/total_revisions.json \
              apps/quality_dms/quality_dms/dms/number_card/total_documents/total_documents.json \
              apps/quality_dms/quality_dms/dms/number_card/draft_documents/draft_documents.json \
              apps/quality_dms/quality_dms/dms/number_card/published_documents/published_documents.json \
              apps/quality_dms/quality_dms/dms/number_card/documents_in_review/documents_in_review.json \
              apps/quality_dms/quality_dms/dms/number_card/obsolete_documents/obsolete_documents.json \
              apps/quality_dms/quality_dms/dms/number_card/approved_documents/approved_documents.json \
              apps/quality_dms/quality_dms/dms/dashboard_chart/training_compliance_by_department/training_compliance_by_department.json \
              apps/quality_dms/quality_dms/dms/dashboard_chart/documents_by_status/documents_by_status.json \
              apps/quality_dms/quality_dms/workspace_sidebar/dms.json \
            ; do
              full="/home/frappe/frappe-bench/${f}"
              echo "--- reimporting ${full} ---"
              docker exec crm-backend-1 bench --site mysite.local execute frappe.modules.import_file.import_file_by_path \
                --kwargs "{\"path\": \"${full}\", \"force\": True, \"ignore_version\": True}" || echo "WARNING: reimport failed for ${full}, continuing"
            done

            echo "=== Clearing Frappe cache (avoid stale asset-hash HTML) ==="
            docker exec crm-backend-1 bench --site mysite.local clear-cache || true
            docker exec crm-backend-1 bench --site mysite.local clear-website-cache || true

            echo "=== Pruning old crm-deploy tags (keep current) ==="
            docker images crm-deploy --format '{{.Tag}}' \
              | grep -v "^${IMAGE_TAG}\$" \
              | xargs -r -I{} docker rmi crm-deploy:{} || true

            echo "=== Post-deploy smoke checks ==="
            SMOKE_OK=1
            for path in /api/method/ping /login; do
              code=$(docker exec crm-backend-1 curl -s -o /dev/null -w "%{http_code}" -H "Host: mysite.local" "http://localhost:8000${path}" || true)
              echo "${path} -> ${code}"
              [ "${code}" = "200" ] || SMOKE_OK=0
            done
            if [ "${SMOKE_OK}" != "1" ]; then
              echo "SMOKE CHECK FAILED - the new version is running but did not answer correctly. Previous tag was ${PREV_TAG:-unknown}."
              exit 1
            fi

            echo "=== Deployment complete: ${IMAGE} ==="
