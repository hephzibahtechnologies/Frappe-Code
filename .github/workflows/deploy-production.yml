name: Deploy to Production

# Manual-only, on purpose: this never runs on push. Pulls whatever image
# tag was already built/pushed by the "Build & Push Images" workflow and
# recreates the stack on 208.109.38.159. No rebuild happens here.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to latest-production)"
        required: false
        default: "latest-production"

env:
  REGISTRY: ghcr.io
  APP_IMAGE_NAME: hephzibahtechnologies/frappe-code

jobs:
  deploy:
    name: Deploy to frappe-crm (208.109.38.159 — production)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}              # 208.109.38.159
          username: ${{ secrets.PROD_USER }}           # david
          password: ${{ secrets.PROD_SSH_PASSWORD }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            set -o pipefail
            IMAGE_TAG="${{ inputs.image_tag }}"
            IMAGE="${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:${IMAGE_TAG}"
            cd /home/david/frappe-crm

            echo "=== Logging in to GHCR ==="
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.STAGING_USER }}" --password-stdin

            echo "=== Pulling ${IMAGE} ==="
            docker pull "${IMAGE}"
            docker tag "${IMAGE}" crm-deploy:${IMAGE_TAG}

            echo "=== Updating .env — same folder, same volumes, no data touched ==="
            sed -i "s/^CUSTOM_TAG=.*/CUSTOM_TAG=${IMAGE_TAG}/" .env

            echo "=== Recreating all app-tier services from the new tag ==="
            docker-compose up -d

            echo "=== Waiting for backend to become healthy before migrating ==="
            for i in $(seq 1 30); do
              if docker exec crm-backend-1 curl -sf -H "Host: mysite.local" http://localhost:8000/api/method/ping >/dev/null 2>&1; then
                echo "Backend is up."
                break
              fi
              echo "Backend not ready yet, waiting... ($i/30)"
              sleep 5
              if [ "$i" -eq 30 ]; then
                echo "Backend never became healthy — aborting before migrate."
                exit 1
              fi
            done

            echo "=== Running bench migrate (schema/patches — do NOT skip, do NOT run manually on the server) ==="
            echo "=== (scoped to mysite.local, not 'all' — unrelated/broken sites on this box must not fail this job) ==="
            echo "=== (piped through tr to flatten the progress bar's \r output — appleboy/ssh-action mis-parses raw \r and can report a false failure even when migrate succeeds) ==="
            docker exec crm-backend-1 bench --site mysite.local migrate 2>&1 | tr '\r' '\n'

            echo "=== Force-reimporting DMS Workspace/Number Card/Dashboard Chart/Sidebar fixtures ==="
            echo "=== (bench migrate does NOT overwrite these once they exist in the DB — see quality_dms dashboard incident 2026-07-28) ==="
            for f in \
              apps/quality_dms/quality_dms/dms/workspace/dms/dms.json \
              apps/quality_dms/quality_dms/dms/number_card/pending_revision_requests/pending_revision_requests.json \
              apps/quality_dms/quality_dms/dms/number_card/total_revisions/total_revisions.json \
              apps/quality_dms/quality_dms/dms/number_card/total_documents/total_documents.json \
              apps/quality_dms/quality_dms/dms/number_card/draft_documents/draft_documents.json \
              apps/quality_dms/quality_dms/dms/number_card/published_documents/published_documents.json \
              apps/quality_dms/quality_dms/dms/number_card/documents_in_review/documents_in_review.json \
              apps/quality_dms/quality_dms/dms/number_card/obsolete_documents/obsolete_documents.json \
              apps/quality_dms/quality_dms/dms/number_card/approved_documents/approved_documents.json \
              apps/quality_dms/quality_dms/dms/dashboard_chart/training_compliance_by_department/training_compliance_by_department.json \
              apps/quality_dms/quality_dms/dms/dashboard_chart/documents_by_status/documents_by_status.json \
              apps/quality_dms/quality_dms/workspace_sidebar/dms.json \
            ; do
              full="/home/frappe/frappe-bench/${f}"
              echo "--- reimporting ${full} ---"
              docker exec crm-backend-1 bench --site mysite.local execute frappe.modules.import_file.import_file_by_path \
                --kwargs "{\"path\": \"${full}\", \"force\": True, \"ignore_version\": True}" || echo "WARNING: reimport failed for ${full}, continuing"
            done

            echo "=== Clearing Frappe cache (avoid stale asset-hash HTML) ==="
            docker exec crm-backend-1 bench --site mysite.local clear-cache || true
            docker exec crm-backend-1 bench --site mysite.local clear-website-cache || true

            echo "=== Pruning old crm-deploy tags (keep current) ==="
            docker images crm-deploy --format '{{.Tag}}' \
              | grep -v "^${IMAGE_TAG}\$" \
              | xargs -r -I{} docker rmi crm-deploy:{} || true

            echo "=== Deployment complete: ${IMAGE} ==="
