name: Deploy to Staging

# Manual-only, on purpose: this never runs on push. It deploys ONE exact commit
# (its image, tagged with the first 12 chars of the SHA, built by "Build & Push
# Images") to 72.167.140.185 - never a moving tag - so every deploy is recorded
# in the "staging" deployment ledger and can be rolled back to by SHA.
# The real work (disk preflight, verified backup, pull, recreate, migrate,
# fixture reimport, smoke checks, ledger) lives in staging-core.yml, shared
# with "Rollback Staging".
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Leave as latest-staging to deploy the newest successfully built commit, or give a 12-char/full commit SHA"
        required: false
        default: "latest-staging"
      skip_backup:
        description: "EMERGENCY ONLY: deploy without the pre-deploy backup (default false)"
        required: false
        type: boolean
        default: false

# One staging operation at a time (deploy or rollback); later ones queue.
concurrency:
  group: staging-server
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  resolve:
    name: Resolve commit to deploy
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
    steps:
      - name: Resolve to a full commit SHA
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -z "${INPUT_TAG}" ] || [ "${INPUT_TAG}" = "latest-staging" ]; then
            sha=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?branch=staging-deployment&status=success&per_page=1" --jq '.workflow_runs[0].head_sha')
          else
            sha=$(gh api "repos/${{ github.repository }}/commits/${INPUT_TAG}" --jq .sha)
          fi
          if [ -z "${sha}" ] || [ "${sha}" = "null" ]; then
            echo "Could not resolve '${INPUT_TAG}' to a commit that has a successful build."
            exit 1
          fi
          echo "Deploying commit ${sha} (image tag ${sha::12})"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: resolve
    uses: ./.github/workflows/staging-core.yml
    with:
      sha: ${{ needs.resolve.outputs.sha }}
      action: deploy
      skip_backup: ${{ inputs.skip_backup }}
    secrets: inherit
