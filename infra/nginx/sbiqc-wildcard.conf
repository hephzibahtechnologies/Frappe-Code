# Wildcard reverse proxy for SBIQC multi-tenant provisioning (Option A).
#
# One config covers every tenant subdomain (*.sbiqc.com) — Frappe's own
# dns_multitenant setting (see sites/common_site_config.json) already routes
# each request to the correct site by Host header once it reaches the bench
# container, so there is nothing tenant-specific to add here when a new
# tenant is provisioned. Provisioning only needs wildcard DNS to already
# point at this server and this file to already be in place.
#
# Install:
#   sudo cp infra/nginx/sbiqc-wildcard.conf /etc/nginx/sites-available/sbiqc-wildcard.conf
#   sudo ln -s /etc/nginx/sites-available/sbiqc-wildcard.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisites (outside this repo, must be done once, manually):
#   1. DNS: an A record  *.sbiqc.com -> <this server's public IP>
#   2. TLS: a wildcard certificate for *.sbiqc.com (must use DNS-01 challenge —
#      HTTP-01 cannot validate wildcards). See infra/nginx/README.md for the
#      certbot command once you tell me which DNS provider you use.

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name *.sbiqc.com sbiqc.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.sbiqc.com sbiqc.com;

    # Populated by certbot (or your ACME client of choice) once the wildcard
    # cert exists — paths shown are certbot's default layout.
    ssl_certificate     /etc/letsencrypt/live/sbiqc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sbiqc.com/privkey.pem;

    client_max_body_size 50m;

    location / {
        # frappe container's web port — matches webserver_port in
        # common_site_config.json (8000) and how deploy-staging.yml's
        # crm-backend-1 container is already reached.
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /socket.io {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
